<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Downloader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<div class="lightbox" id="lightboxOverlay" style="display: none;">
  <img id="lightboxImage"/>
</div>
<body>
<div id="themeToggleWrapper">
  <button id="themeToggle">Toggle Dark Mode 🌙</button>
</div>

<div class="container">
  <div class="form-section">
    <h1>YouTube Downloader</h1>

    <label for="urlInput">URL:</label>
    <input id="urlInput" placeholder="https://youtube.com/..." type="text"/>

    <label for="outputDirInput">Output Folder:</label>
    <div class="folder-picker">
      <input id="outputDirInput" type="text" value="./downloads"/>
      <button onclick="selectFolder()">📁</button>
    </div>

    <label for="mediaType">Type:</label>
    <select id="mediaType">
      <option value="video">Video</option>
      <option value="audio">Audio</option>
    </select>

    <div id="videoOptions">
      <label for="resolutionSelect">Resolution:</label>
      <select id="resolutionSelect"></select>

      <label for="videoBitrateSelect">Video Audio Bitrate:</label>
      <select id="videoBitrateSelect"></select>
    </div>

    <div id="audioOptions">
      <label for="audioBitrateSelect">Audio Bitrate:</label>
      <select id="audioBitrateSelect"></select>
    </div>

    <label for="formatSelect">Format:</label>
    <select id="formatSelect"></select>

    <button id="fetchOptions">Get Video Details</button>
    <button id="startDownload">Download</button>
    <ul id="downloadQueue"></ul>

    <div class="progress">
      <div id="progressBar"></div>
    </div>
    <p id="status">Ready.</p>
  </div>

  <div class="preview-section" id="previewSection" style="display: none;">
    <img alt="Thumbnail" id="thumbnail"/>
    <iframe allowfullscreen id="previewFrame"></iframe>
  </div>
  <div class="video-meta" id="videoMeta" style="display: none;">
    <h3><a href="#" id="videoTitleLink" target="_blank"></a></h3>
    <p>Channel: <strong id="channelName">-</strong></p>
    <p>Published: <span id="publishDate">-</span></p>
    <p>Duration: <span id="videoDuration">-</span></p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
